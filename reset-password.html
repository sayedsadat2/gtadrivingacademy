<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | GTA Driving Academy</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
  >

  <link
    rel="stylesheet"
    href="css/style.css?v=5"
  >

  <link
    rel="stylesheet"
    href="css/lms.css?v=1"
  >
</head>

<body class="lms-body">

  <main class="auth-shell">

    <section
      class="auth-card"
      aria-labelledby="reset-title"
    >

      <a
        href="index.html"
        class="auth-logo"
        aria-label="GTA Driving Academy home"
      >
        <img
          src="images/logo-full.png"
          alt="GTA Driving Academy"
        >
      </a>

      <p class="auth-eyebrow">
        Student Portal
      </p>

      <h1 id="reset-title">
        Create a new password
      </h1>

      <p class="auth-intro">
        Choose a new password for your GTA Driving Academy student account.
      </p>

      <form
        id="resetPasswordForm"
        class="auth-form"
        novalidate
      >

        <label for="newPassword">
          New password
        </label>

        <input
          id="newPassword"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="10"
          maxlength="128"
          aria-describedby="passwordRequirements"
          required
        >

        <p
          id="passwordRequirements"
          class="auth-help"
        >
          Use at least 10 characters. A longer, unique password is recommended.
        </p>

        <label for="confirmPassword">
          Confirm new password
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="10"
          maxlength="128"
          required
        >

        <button
          id="updatePasswordButton"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Update password
        </button>

        <p
          id="resetPasswordMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>

      </form>

      <a
        class="auth-back"
        href="login.html"
      >
        ← Back to student login
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/reset-password.js"></script>

</body>
</html>
