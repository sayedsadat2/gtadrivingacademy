<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Identity | GTA Driving Academy</title>

  <style>
    :root {
      --navy-deep: #071A33;
      --navy: #0B2545;
      --orange: #F2971B;
      --orange-dark: #CC7A0C;
      --paper: #FFFFFF;
      --fog: #F7F8FA;
      --line: #D8DEE4;
      --ink: #16202C;
      --ink-soft: #46505C;
      --danger: #A3132A;
      --success: #1F6B3A;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(
          120% 140% at 50% -10%,
          #123561 0%,
          var(--navy-deep) 55%,
          #050F20 100%
        );
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--paper);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-deep);
      font-weight: 800;
      font-size: 20px;
    }

    .brand-text {
      font-weight: 800;
      color: var(--navy);
      line-height: 1.2;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 1.55rem;
    }

    p {
      color: var(--ink-soft);
      line-height: 1.55;
      margin: 0 0 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: var(--navy);
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 1.05rem;
      letter-spacing: 0.15em;
      text-align: center;
    }

    input:focus {
      outline: 3px solid rgba(242, 151, 27, 0.25);
      border-color: var(--orange);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: var(--orange);
      color: var(--navy-deep);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #FDEEEF;
      color: var(--danger);
    }

    .message.success {
      background: #EFFAF2;
      color: var(--success);
    }

    .helper {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--ink-soft);
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card" aria-labelledby="mfa-title">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div class="brand-text">
        GTA Driving Academy<br>
        Student Portal
      </div>
    </div>

    <h1 id="mfa-title">Verify your identity</h1>

    <p>
      Enter the 6-digit code from your authenticator app to continue to the
      student learning portal.
    </p>

    <form id="mfa-form" novalidate>
      <label for="mfa-code">Authenticator code</label>

      <input
        id="mfa-code"
        name="mfa-code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="[0-9]{6}"
        aria-describedby="mfa-message"
        required
      >

      <button id="mfa-submit" type="submit">
        Verify and continue
      </button>

      <div
        id="mfa-message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>
    </form>

    <div class="helper">
      For your security, training access requires multi-factor verification.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/mfa.js"></script>
</body>
</html>
