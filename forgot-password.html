<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | GTA Driving Academy</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/lms.css?v=1">
</head>

<body class="lms-body">

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="reset-title">

      <a href="index.html" class="auth-logo">
        <img src="images/logo-full.png" alt="GTA Driving Academy">
      </a>

      <p class="auth-eyebrow">Student Portal</p>

      <h1 id="reset-title">Forgot your password?</h1>

      <p class="auth-intro">
        Enter the email address associated with your student account.
        We'll send you a secure link to reset your password.
      </p>

      <form id="forgotPasswordForm" class="auth-form">

        <label for="email">Email address</label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <button
          id="resetButton"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Send reset link
        </button>

        <p
          id="resetMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></p>

      </form>

      <a class="auth-back" href="login.html">
        ← Back to student login
      </a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/forgot-password.js"></script>

</body>
</html>
